<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- viewport-fit=cover lets the app draw under the notch; the app adds its own safe padding -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" id="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sales, stock, customers and profit for your business." />

    <!-- Lets "Add to Home Screen" open it like an app, with no browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Tally</title>

    <!-- Applies dark mode before the page paints, so there is no white flash -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Tally needs JavaScript switched on to work.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
